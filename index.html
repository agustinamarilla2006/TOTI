<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Trinidad 🌻</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: linear-gradient(180deg, #87ceeb 0%, #b0e0e6 45%, #e0f6ff 70%, #d4f1f9 100%);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        /* Sol Radiante */
        .sol {
            position: absolute;
            top: 40px;
            right: 80px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #fff7ad 20%, #ffd700 60%, rgba(255, 215, 0, 0) 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px #ffd700, 0 0 100px rgba(255, 223, 0, 0.6);
            animation: resplandorSol 4s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes resplandorSol {
            0% { transform: scale(0.98); opacity: 0.9; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        /* Nubes flotantes */
        .nube {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50px;
            backdrop-filter: blur(2px);
            z-index: 1;
            animation: flotarNube linear infinite;
        }

        .nube::before, .nube::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
        }

        .nube1 {
            width: 140px; height: 45px;
            top: 80px; left: -160px;
            animation-duration: 38s;
        }
        .nube1::before { width: 60px; height: 60px; top: -25px; left: 20px; }
        .nube1::after { width: 45px; height: 45px; top: -15px; left: 65px; }

        .nube2 {
            width: 190px; height: 55px;
            top: 150px; left: -220px;
            animation-duration: 52s;
            animation-delay: 12s;
            opacity: 0.75;
        }
        .nube2::before { width: 80px; height: 80px; top: -35px; left: 30px; }
        .nube2::after { width: 60px; height: 60px; top: -20px; left: 95px; }

        @keyframes flotarNube {
            0% { transform: translateX(0); }
            100% { transform: translateX(120vw); }
        }

        /* Parque / Fondo con Césped */
        .colinas-fondo {
            position: absolute;
            bottom: 11%;
            width: 100%;
            height: 180px;
            background: #73a942;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            transform: scaleX(1.4);
            z-index: 1;
            opacity: 0.85;
        }

        .suelo-cesped {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 13%;
            background: linear-gradient(180deg, #538d22 0%, #245501 100%);
            border-top: 6px solid #70e000;
            z-index: 1;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.15);
            overflow: visible;
        }

        /* Flores Silvestres en el Pasto (Primavera) */
        .flores-pasto-container {
            position: absolute;
            top: -25px;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .flor-pasto {
            position: absolute;
            font-size: 1.2rem;
            animation: mecidoSuave 3s ease-in-out infinite alternate;
            transform-origin: bottom center;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        @keyframes mecidoSuave {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }

        /* Escena Principal */
        .escena {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Botón Semilla Inicial */
        .semilla-btn {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translate(-50%, 50%);
            z-index: 100;
            cursor: pointer;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            padding: 12px 26px;
            border-radius: 30px;
            border: 2px solid #ffd166;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .semilla-btn:hover {
            transform: translate(-50%, 50%) scale(1.12);
            background: #ffffff;
        }

        .semilla-icon {
            font-size: 2.8rem;
            animation: latido 1.5s infinite;
        }

        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .semilla-texto {
            font-size: 1rem;
            font-weight: 700;
            color: #3a2e2b;
            margin-left: 10px;
            white-space: nowrap;
        }

        /* Contenedor del Árbol */
        .arbol-container {
            position: absolute;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            transition: left 1.5s cubic-bezier(0.65, 0, 0.35, 1);
            z-index: 2;
        }

        .arbol-container.desplazado {
            left: 73%;
        }

        canvas {
            display: block;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.25));
        }

        /* Contenedor de Flores con Mecido Suave */
        .flores-corazon {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            animation: vientoCopa 4s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }

        @keyframes vientoCopa {
            0% { transform: rotate(-1.2deg); }
            100% { transform: rotate(1.5deg); }
        }

        .flor-item {
            position: absolute;
            font-size: 1.5rem;
            transform: scale(0);
            animation: aparecerFlor 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.3s ease;
            will-change: transform;
        }

        .flor-item:hover {
            transform: scale(1.8) rotate(15deg) !important;
            z-index: 20;
        }

        @keyframes aparecerFlor {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* Carta de texto */
        .carta-container {
            position: absolute;
            left: 6%;
            top: 18%;
            width: 44%;
            max-width: 520px;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.2s ease;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.6);
        }

        .carta-container.activo {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .titulo-carta {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2d1e18;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cuerpo-carta {
            font-size: 1.05rem;
            line-height: 1.9;
            color: #3e2a22;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            min-height: 120px;
        }

        .pie-carta {
            margin-top: 25px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #1b1b1b;
            font-style: italic;
            border-top: 2px dashed #ffd166;
            padding-top: 15px;
        }

        /* Partículas / Hojas / Pétalos */
        .efecto-clic {
            position: absolute;
            pointer-events: none;
            font-size: 1.4rem;
            font-weight: bold;
            color: #d4a373;
            animation: animarParticula 1.2s ease-out forwards;
            z-index: 999;
        }

        @keyframes animarParticula {
            0% { opacity: 1; transform: translate(0, 0) scale(0.6) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(180deg); }
        }

        .hoja-caida {
            position: absolute;
            top: -50px;
            pointer-events: none;
            font-size: 1.3rem;
            opacity: 0.85;
            animation: caidaHoja linear forwards;
        }

        @keyframes caidaHoja {
            0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.9; }
            50% { transform: translateY(50vh) rotate(180deg) translateX(70px); }
            100% { transform: translateY(105vh) rotate(360deg) translateX(-50px); opacity: 0; }
        }

        @media (max-width: 768px) {
            .arbol-container.desplazado { left: 50%; opacity: 0.25; }
            .carta-container { width: 88%; left: 6%; top: 10%; padding: 20px; }
            .titulo-carta { font-size: 1.1rem; }
            .cuerpo-carta { font-size: 0.9rem; }
            .pie-carta { font-size: 1.4rem; }
            .sol { width: 70px; height: 70px; right: 20px; top: 20px; }
        }
    </style>
</head>
<body>

    <!-- Sol y Nubes -->
    <div class="sol"></div>
    <div class="nube nube1"></div>
    <div class="nube nube2"></div>

    <!-- Fondo de Parque / Pasto -->
    <div class="colinas-fondo"></div>
    <div class="suelo-cesped">
        <div class="flores-pasto-container" id="floresPasto"></div>
    </div>

    <div class="escena" id="escena">
        <button class="semilla-btn" id="btnInicio" onclick="iniciarAnimacion(event)">
            <span class="semilla-icon">🌻</span>
            <span class="semilla-texto">Para Trinidad ❤️ (Click Aquí)</span>
        </button>

        <div class="carta-container" id="carta">
            <div class="titulo-carta">
                <span>🌻</span> <span id="txtTitulo"></span> <span>🌻</span>
            </div>
            
            <div class="cuerpo-carta" id="txtCuerpo"></div>

            <div class="pie-carta" id="txtPie"></div>
        </div>

        <div class="arbol-container" id="arbolContainer">
            <canvas id="canvasArbol" width="620" height="850"></canvas>
            <div class="flores-corazon" id="floresCorazon"></div>
        </div>
    </div>

    <script>
        const TEXTO_TITULO = "FELIZ DÍA DE LAS FLORES AMARILLAS MYLOVEEEEE 💛";
        
        const LINEAS_CARTA = [
            "CADA FLORCITA HERMOSA",
            "PARA LA MUJER MAS HERMOSA"
        ];

        const TEXTO_PIE = "Para mi totiiii, ya que estas de viaje al menos te las mando por aca y cuando nos veamos te doy las posta. Te amo hermosa mia";

        const canvas = document.getElementById('canvasArbol');
        const ctx = canvas.getContext('2d');
        let interactivoHabilitado = false;

        generarFloresEnPasto();
        setInterval(crearHojaCaida, 800); // Intervalo más ligero para móviles

        function generarFloresEnPasto() {
            const contenedor = document.getElementById('floresPasto');
            const tiposFlores = ['🌻', '🌼', '🌷', '🌸', '🌹', '🌺', '🪻', '🌻', '🌼'];
            const cantidad = 25; 

            for (let i = 0; i < cantidad; i++) {
                const flor = document.createElement('span');
                flor.classList.add('flor-pasto');
                flor.innerText = tiposFlores[Math.floor(Math.random() * tiposFlores.length)];
                flor.style.left = Math.random() * 95 + 'vw';
                flor.style.top = (Math.random() * 25 - 10) + 'px';
                flor.style.fontSize = (Math.random() * 0.4 + 0.8) + 'rem';
                flor.style.animationDelay = (Math.random() * 2) + 's';
                flor.style.animationDuration = (Math.random() * 2 + 2) + 's';

                contenedor.appendChild(flor);
            }
        }

        function iniciarAnimacion(e) {
            e.stopPropagation();
            document.getElementById('btnInicio').style.display = 'none';

            animarArbol(() => {
                crearCopaAltisima();
                desplazarYMostrarTexto();
                interactivoHabilitado = true;
            });
        }

        function animarArbol(callback) {
            let progreso = 0;

            function dibujar() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const p = Math.min(progreso, 1);

                ctx.strokeStyle = '#2d1e18';
                ctx.lineCap = 'round';

                // Raíces
                ctx.beginPath();
                ctx.moveTo(310, 800);
                ctx.quadraticCurveTo(230, 825, 150, 840);
                ctx.lineWidth = 18 * p;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(310, 800);
                ctx.quadraticCurveTo(390, 825, 470, 840);
                ctx.lineWidth = 18 * p;
                ctx.stroke();

                // Tronco
                ctx.beginPath();
                ctx.moveTo(310, 820);
                ctx.quadraticCurveTo(285, 520, 310, 220);
                ctx.lineWidth = 48 * (1 - (1 - p) * 0.2);
                ctx.stroke();

                // Veta interior
                ctx.beginPath();
                ctx.moveTo(310, 810);
                ctx.quadraticCurveTo(290, 520, 310, 220);
                ctx.lineWidth = 26;
                ctx.strokeStyle = '#3e2a22';
                ctx.stroke();
                ctx.strokeStyle = '#2d1e18';

                // TRINIDAD Tallado
                if (progreso > 0.35) {
                    let opacidad = Math.min((progreso - 0.35) * 2, 1);
                    const letras = "TRINIDAD".split("");
                    const posicionesY = [680, 630, 580, 530, 480, 430, 380, 330];
                    const desviacionesX = [303, 298, 295, 294, 296, 300, 304, 308];

                    ctx.save();
                    ctx.globalAlpha = opacidad;
                    ctx.font = '700 24px "Dancing Script", cursive';
                    ctx.textAlign = 'center';

                    letras.forEach((letra, i) => {
                        let x = desviacionesX[i];
                        let y = posicionesY[i];

                        ctx.fillStyle = 'rgba(15, 8, 5, 0.9)';
                        ctx.fillText(letra, x + 1, y + 2);

                        ctx.fillStyle = '#f3c283';
                        ctx.fillText(letra, x, y);
                    });

                    ctx.restore();
                }

                // Ramas
                if (progreso > 0.3) {
                    let p1 = Math.min((progreso - 0.3) * 1.43, 1);
                    ctx.beginPath();
                    ctx.moveTo(298, 510);
                    ctx.quadraticCurveTo(180, 440, 100, 330);
                    ctx.lineWidth = 22 * p1;
                    ctx.stroke();
                }

                if (progreso > 0.4) {
                    let p2 = Math.min((progreso - 0.4) * 1.66, 1);
                    ctx.beginPath();
                    ctx.moveTo(322, 470);
                    ctx.quadraticCurveTo(440, 400, 520, 290);
                    ctx.lineWidth = 22 * p2;
                    ctx.stroke();
                }

                if (progreso > 0.5) {
                    let p3 = Math.min((progreso - 0.5) * 2, 1);
                    ctx.beginPath();
                    ctx.moveTo(310, 280);
                    ctx.quadraticCurveTo(250, 170, 200, 80);
                    ctx.lineWidth = 15 * p3;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(310, 280);
                    ctx.quadraticCurveTo(370, 170, 420, 80);
                    ctx.lineWidth = 15 * p3;
                    ctx.stroke();
                }

                progreso += 0.03;
                if (progreso <= 1) {
                    requestAnimationFrame(dibujar);
                } else {
                    if (callback) callback();
                }
            }
            dibujar();
        }

        // Cantidad óptima de flores para fluidez móvil (200 flores)
        function crearCopaAltisima() {
            const contenedor = document.getElementById('floresCorazon');
            const totalFlores = 200; 
            let creadas = 0;

            const intervalo = setInterval(() => {
                if (creadas >= totalFlores) {
                    clearInterval(intervalo);
                    return;
                }

                let coords = obtenerCoordenadasCopa();

                const flor = document.createElement('div');
                flor.classList.add('flor-item');
                
                const iconos = ['🌻', '🌻', '🌻', '🌼', '🌼', '💛', '✨'];
                flor.innerText = iconos[Math.floor(Math.random() * iconos.length)];

                flor.style.left = (coords.x - 14) + 'px';
                flor.style.top = (coords.y - 14) + 'px';

                flor.onclick = (e) => {
                    e.stopPropagation();
                    crearExplosionParticulas(e.clientX, e.clientY, ['✨', 'Trinidad 💛', '🌻']);
                };

                contenedor.appendChild(flor);
                creadas++;
            }, 8);
        }

        function obtenerCoordenadasCopa() {
            const centros = [
                { x: 310, y: 80,  r: 120 },
                { x: 210, y: 130, r: 120 },
                { x: 410, y: 130, r: 120 },
                { x: 120, y: 240, r: 110 },
                { x: 500, y: 230, r: 110 },
                { x: 310, y: 220, r: 140 },
                { x: 220, y: 320, r: 100 },
                { x: 400, y: 310, r: 100 }
            ];

            const c = centros[Math.floor(Math.random() * centros.length)];
            let angulo = Math.random() * Math.PI * 2;
            let radio = Math.sqrt(Math.random()) * c.r;

            return {
                x: c.x + Math.cos(angulo) * radio,
                y: c.y + Math.sin(angulo) * radio
            };
        }

        function desplazarYMostrarTexto() {
            setTimeout(() => {
                document.getElementById('arbolContainer').classList.add('desplazado');

                setTimeout(() => {
                    document.getElementById('carta').classList.add('activo');
                    document.getElementById('txtTitulo').innerText = TEXTO_TITULO;
                    document.getElementById('txtPie').innerText = TEXTO_PIE;
                    escribirTextoLento();
                }, 800);
            }, 400);
        }

        function escribirTextoLento() {
            const contenedorTexto = document.getElementById('txtCuerpo');
            let lineaIndex = 0;
            let charIndex = 0;

            function tippear() {
                if (lineaIndex < LINEAS_CARTA.length) {
                    let lineaActual = LINEAS_CARTA[lineaIndex];
                    
                    if (charIndex === 0 && lineaIndex > 0) {
                        contenedorTexto.innerHTML += '<br><br>';
                    }

                    contenedorTexto.innerHTML += lineaActual.charAt(charIndex);
                    charIndex++;

                    if (charIndex < lineaActual.length) {
                        setTimeout(tippear, 45);
                    } else {
                        charIndex = 0;
                        lineaIndex++;
                        setTimeout(tippear, 300);
                    }
                }
            }
            tippear();
        }

        document.addEventListener('click', (e) => {
            if (!interactivoHabilitado) return;
            crearExplosionParticulas(e.clientX, e.clientY, ['🌻', 'Trinidad 💛', '✨', '🌼']);
        });

        function crearExplosionParticulas(x, y, elementos) {
            for (let i = 0; i < 6; i++) {
                const p = document.createElement('div');
                p.classList.add('efecto-clic');
                p.innerText = elementos[Math.floor(Math.random() * elementos.length)];
                p.style.left = x + 'px';
                p.style.top = y + 'px';

                let angle = Math.random() * Math.PI * 2;
                let dist = Math.random() * 60 + 20;
                p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
                p.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);

                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        }

        function crearHojaCaida() {
            const hoja = document.createElement('div');
            hoja.classList.add('hoja-caida');
            const elementos = ['🍃', '🌿', '🌻', '🌼', '💛'];
            hoja.innerText = elementos[Math.floor(Math.random() * elementos.length)];
            hoja.style.left = Math.random() * 95 + 'vw';
            
            const duracion = Math.random() * 3 + 5;
            hoja.style.animationDuration = duracion + 's';
            hoja.style.fontSize = (Math.random() * 0.6 + 0.8) + 'rem';

            document.body.appendChild(hoja);
            setTimeout(() => hoja.remove(), duracion * 1000);
        }
    </script>
</body>
</html>
